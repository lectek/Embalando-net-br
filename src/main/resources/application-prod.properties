###############################################################################
#  PERFIL: production - Docker (MySQL 8 em Container)
#  ➜ Ative com SPRING_PROFILES_ACTIVE=prod
###############################################################################

# 1. Servidor
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.main.banner-mode=off
spring.mvc.locale=pt_BR
spring.mvc.format.date=iso

# 2. Datasource (MySQL no container 'mysql')
spring.datasource.url=jdbc:mysql://mysql:3306/embalando?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:embalando}
spring.datasource.password=${DB_PASSWORD:embalando_pwd}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=embalando-prod-pool

# 3. JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# 4. Cache
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=5000,expireAfterWrite=10m
spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.JCacheRegionFactory
spring.jpa.properties.javax.cache.provider=org.ehcache.jsr107.EhcacheCachingProvider

# 5. Segurança (JWT)
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-in-ms=900000

# 6. E-mail (SMTP)
spring.mail.host=email-smtp.eu-west-1.amazonaws.com
spring.mail.port=587
spring.mail.username=${SMTP_USER}
spring.mail.password=${SMTP_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8
spring.mail.from=no-reply@embalando.com

# 7. Logging
logging.level.root=INFO
logging.level.br.com.embalando=INFO
logging.level.org.hibernate.SQL=ERROR
logging.level.org.springframework.web=INFO
logging.file.name=/var/log/embalando/embalando.log
logging.file.max-size=10MB
logging.file.total-size-cap=100MB

# 8. Actuator / Métricas
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.metrics.export.prometheus.enabled=true
management.server.port=8081

# 9. CORS (ajustável via WebMvcConfig)
app.cors.allowed-origins=https://app.embalando.com
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type
