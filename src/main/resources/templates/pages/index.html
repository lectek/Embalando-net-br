<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Embalando • Loja de Produtos Pet</title>
  <meta name="description" content="Embalando: os melhores acessórios para pets. Confira novidades, promoções e avaliações de clientes satisfeitos.">

  <!-- Open Graph -->
  <meta property="og:title" content="Embalando • Loja de Produtos Pet">
  <meta property="og:description" content="Encontre coleiras, brinquedos e acessórios para seu pet com qualidade e segurança.">
  <meta property="og:image" th:content="@{/img/hero.webp}">
  <meta property="og:url" content="https://seusite.com">
  <meta property="og:type" content="website">
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/layout.css" />
<link rel="stylesheet" href="/css/header.css" />
<link rel="stylesheet" href="/css/footer.css" />
<link rel="stylesheet" href="/css/index.css" />

  <!-- Variáveis CSS -->
  <style>
    :root {
      --primaria: #2a9d8f;
      --secundaria: #264653;
      --neutra: #f4f4f4;
      --texto: #333333;
      --espaco: 8px;
      --transicao: 250ms;
    }
  </style>

  <!-- Rich Snippet -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Product",
    "name": "Coleira Vermelha",
    "image": "/img/produto1.webp",
    "description": "Coleira confortável e resistente para seu pet.",
    "sku": "COLV-001",
    "brand": {
      "@type": "Brand",
      "name": "Embalando"
    },
    "offers": {
      "@type": "Offer",
      "url": "https://seusite.com/produto.html",
      "priceCurrency": "BRL",
      "price": "49.90",
      "availability": "https://schema.org/InStock"
    }
  }
  </script>
</head>
<body>

  <header th:replace="fragments/header :: header"></header>

  <main id="main" class="container" role="main">
    <!-- Hero -->
    <section id="hero" class="hero mt-8" style="text-align:center; padding: calc(var(--espaco) * 4) 0;">
      <picture>
        <source srcset="../img/hero.avif" type="image/avif">
        <source srcset="../img/hero.webp" type="image/webp">
        <img src="../img/hero.jpg" alt="Produtos premium para seu pet" width="1200" height="600" loading="eager">
      </picture>
      <h1 class="page-title mt-4">Tudo o que seu pet merece</h1>
      <p class="subtitle mt-2">Acessórios de qualidade e entrega rápida</p>
      <a href="#produtos" class="btn mt-4" aria-label="Ver produtos">Ver Produtos</a>
    </section>

    <!-- Produtos -->
    <section id="produtos" class="mt-12">
      <h2 class="section-title">Destaques</h2>
      <div class="grid" style="grid-template-columns: 1fr; gap: calc(var(--espaco) * 4);">
        <article class="card" role="group">
          <picture>
            <source srcset="../img/produto1.avif" type="image/avif">
            <source srcset="../img/produto1.webp" type="image/webp">
            <img src="../img/produto1.jpg" alt="Coleira Vermelha" width="300" height="300" loading="lazy">
          </picture>
          <div class="card-body">
            <h3 class="card-title">Coleira Vermelha</h3>
            <p class="card-price">R$ 49,90</p>
            <a class="btn" href="produto.html" aria-label="Detalhes da Coleira Vermelha">Ver detalhes</a>
          </div>
        </article>
      </div>
    </section>

    <!-- Avaliações -->
    <section id="avaliacoes" class="reviews mt-12">
      <h2 class="section-title">O que nossos clientes dizem</h2>
      <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: calc(var(--espaco) * 4);">
        <article class="review-card" role="article">
          <p aria-label="5 estrelas" class="stars">★★★★★</p>
          <blockquote class="mt-2">"Produto excelente, chegou rápido e o meu pet adorou!"</blockquote>
          <p class="review-author mt-1">— Maria S.</p>
        </article>
      </div>
    </section>

    <!-- Selos de Segurança -->
    <section id="selos" class="trust mt-12" aria-label="Selos de segurança e pagamento">
      <h2 class="section-title">Compra segura</h2>
      <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(100px,1fr)); gap: calc(var(--espaco) * 4);">
        <img src="../img/ssl.svg" alt="SSL Seguro" width="100" height="50">
        <img src="../img/pagamento.svg" alt="Pagamentos Diversos" width="100" height="50">
      </div>
    </section>
  </main>

  <!-- Rodapé dinâmico -->
  <footer th:replace="fragments/footer :: footer"></footer>

</body>
</html>
