<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout • Embalando • Loja Online de Produtos Pet</title>
  <meta name="description" content="Finalize sua compra na Embalando: confira detalhes do pedido e preencha seus dados para entrega." />

  <!-- CSS global da loja -->
  <link rel="stylesheet" href="../css/style.css" />
  <!-- CSS específico do checkout -->
  <link rel="stylesheet" href="../css/checkout.css" />
</head>
<body>

  <!-- Navbar com navegação -->
  <header class="navbar" role="banner">
    <div class="container">
      <a href="index.html" class="navbar-brand" aria-label="Página inicial Embalando">
        EMBALANDO
      </a>
      <nav role="navigation" aria-label="Menu principal">
        <ul class="navbar-nav">
          <li><a href="index.html">Home</a></li>
          <li><a href="produtos.html">Produtos</a></li>
          <li><a href="carrinho.html">Carrinho</a></li>
          <li><a href="contato.html">Contato</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Checkout One-Page -->
  <main id="checkout" class="container checkout-container" role="main">
    <!-- Formulário de Checkout -->
    <form action="/finalizar" method="POST"
          class="checkout-form"
          aria-labelledby="checkout-title"
          novalidate>

      <h1 id="checkout-title" class="section-title mb-4">Checkout</h1>

      <!-- Dados Pessoais -->
      <fieldset class="mb-4" aria-labelledby="dados-pessoais-legend">
        <legend id="dados-pessoais-legend" class="fieldset-title">Dados Pessoais</legend>

        <div class="form-group mb-3">
          <label for="nome">Nome Completo <span aria-hidden="true">*</span></label>
          <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Seu nome completo"
            autocomplete="name"
            required
            aria-required="true"
          />
          <span class="field-message" aria-live="polite"></span>
        </div>

        <div class="form-group mb-3">
          <label for="email">E-mail <span aria-hidden="true">*</span></label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="exemplo@dominio.com"
            autocomplete="email"
            required
            aria-required="true"
          />
          <span class="field-message" aria-live="polite"></span>
        </div>

        <div class="form-group mb-3">
          <label for="endereco">Endereço de Entrega <span aria-hidden="true">*</span></label>
          <input
            type="text"
            id="endereco"
            name="endereco"
            placeholder="Rua, número, bairro, cidade"
            autocomplete="street-address"
            required
            aria-required="true"
          />
          <span class="field-message" aria-live="polite"></span>
        </div>
      </fieldset>

      <div class="separator mb-4"></div>

      <!-- Pagamento -->
      <fieldset class="mb-4" aria-labelledby="pagamento-legend">
        <legend id="pagamento-legend" class="fieldset-title">Forma de Pagamento</legend>

        <div class="form-group mb-3">
          <label for="pagamento">Selecione o método <span aria-hidden="true">*</span></label>
          <select
            id="pagamento"
            name="pagamento"
            required
            aria-required="true"
          >
            <option value="">Selecione…</option>
            <option value="cartao">Cartão de Crédito</option>
            <option value="boleto">Boleto Bancário</option>
            <option value="pix">PIX</option>
          </select>
          <span class="field-message" aria-live="polite"></span>
        </div>
      </fieldset>

      <!-- Finalizar Compra + Selos de Confiança -->
      <div class="form-group mb-4">
        <button
          type="submit"
          class="btn-checkout"
          aria-label="Finalizar compra"
        >
          Finalizar Compra
        </button>
        <div class="trust-badges mt-2" aria-label="Checkout 100% seguro">
          <img src="../img/ssl.svg" alt="SSL Seguro" width="24" height="24" />
          <img src="../img/pagamento.svg" alt="Métodos de pagamento diversos" width="24" height="24" />
          <span>Checkout 100% seguro 🔒</span>
        </div>
      </div>
    </form>

    <!-- Resumo do Pedido Sticky (desktop) -->
    <aside class="order-summary" aria-labelledby="resumo-pedido-title">
      <h2 id="resumo-pedido-title" class="section-title mb-4">Resumo do Pedido</h2>

      <div class="summary-item mb-3">
        <img src="../img/produto1.jpg" alt="Coleira Vermelha" width="48" height="48" />
        <div class="item-info">
          <span class="item-name">Coleira Vermelha</span>
          <span class="item-price">R$ 49,90</span>
        </div>
      </div>

      <div class="summary-item mb-3">
        <span>Quantidade</span>
        <span>1</span>
      </div>

      <div class="separator mb-3"></div>

      <div class="summary-item total mb-3">
        <span>Total</span>
        <span>R$ 49,90</span>
      </div>
    </aside>
  </main>

  <!-- Footer minimalista -->
  <footer class="footer text-center mb-4" role="contentinfo">
    <div class="container">
      <p>&copy; 2025 Embalando. Todos os direitos reservados.</p>
    </div>
  </footer>

</body>
</html>
