###############################################################################
#  application-test.properties  (Spring Boot 3 · Java 17)                     #
#  ➜ Arquivo-alvo: src/main/resources/application-test.properties             #
#  Orientado a testes automatizados (JUnit / Testcontainers).                 #
#                                                                              #
#  🔀 Duas opções de datasource, escolha uma:                                  #
#    A) MySQL 8 no container  mysql_embalando  (banco embalando_test)          #
#    B) H2 em memória (mais rápido em CI)                                      #
#                                                                              #
#  Para trocar, COMENTE um bloco e DESCOMENTE o outro.                         #
###############################################################################


###############################################################################
# 🅐  DATASOURCE - MySQL 8  (container mysql_embalando) ────────────────────── #
#     docker run --name mysql_embalando -e MYSQL_DATABASE=embalando_test \     #
#       -e MYSQL_USER=embalando -e MYSQL_PASSWORD=embalando \                  #
#       -e MYSQL_ROOT_PASSWORD=embalando -p 3306:3306 -d mysql:8               #
###############################################################################
#spring.datasource.url=jdbc:mysql://localhost:3306/embalando_test?characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
#spring.datasource.username=embalando
#spring.datasource.password=embalando
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.hikari.maximum-pool-size=5

###############################################################################
# 🅑  DATASOURCE - H2 em memória  (padrão) ─────────────────────────────────── #
#     Mais veloz para pipelines CI. Mantém compatibilidade usando MODE=MYSQL   #
###############################################################################
spring.datasource.url=jdbc:h2:mem:embalando_test;DB_CLOSE_DELAY=-1;MODE=MYSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=5

###############################################################################
# ⚙️  CONFIGURAÇÕES COMUNS DE APLICAÇÃO (Test Profile) ------------------------
###############################################################################
spring.application.name=embalando-test
server.port=8081                           # evita conflito com perfil dev
spring.mvc.locale=pt_BR
spring.mvc.locale-resolver=fixed
spring.jackson.time-zone=America/Fortaleza
spring.main.banner-mode=off               # reduz ruído em logs de CI

###############################################################################
# 🗄️  JPA / HIBERNATE ---------------------------------------------------------
###############################################################################
spring.jpa.hibernate.ddl-auto=create-drop   # cria ao iniciar, dropa ao final
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true                    # imprime queries
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
spring.jpa.open-in-view=false

###############################################################################
# 📝 LOGGING (detalhado p/ testes, sem senhas) --------------------------------
###############################################################################
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.pattern.console=%d{HH:mm:ss} %highlight(%-5level) [%thread] %cyan(%logger{36}) - %msg%n

###############################################################################
# 🛡️  SEGURANÇA / SERVIÇOS EXTERNOS (desativados em testes) -------------------
###############################################################################
spring.security.user.name=tester
spring.security.user.password=tester
spring.mail.host=localhost
spring.mail.port=2525
spring.cloud.config.enabled=false           # evita chamadas externas

###############################################################################
# 🧹  ISOLAMENTO E LIMPEZA -----------------------------------------------------
###############################################################################
spring.sql.init.mode=never                  # evita executar schema.sql/data.sql
spring.jpa.properties.hibernate.hbm2ddl.import_files_sql_extractor=org.hibernate.tool.schema.internal.exec.MultipleLinesSqlCommandExtractor
# Desliga web-server em testes unitários headless (habilite se faz testes MVC)
#spring.main.web-application-type=none
