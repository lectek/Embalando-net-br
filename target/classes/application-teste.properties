################################################################################
# 🧪 application-test.properties – TESTE AUTOMATIZADO (JUnit/Testcontainers)   #
# Perfil para testes unitários e de integração                                 #
################################################################################

# 🅑 H2 em memória (modo MySQL) – mais rápido para CI/CD
spring.datasource.url=jdbc:h2:mem:embalando_test;DB_CLOSE_DELAY=-1;MODE=MYSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=5

# Obs: Caso deseje rodar testes de integração com container MySQL:
# (garanta que o banco `embalando_test` existe no mysql_embalando e descomente abaixo)
#
# spring.datasource.url=jdbc:mysql://mysql:3306/embalando_test?characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=embalando
# spring.datasource.password=embalando_pwd
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 🌎 Configurações gerais
spring.application.name=embalando-test
server.port=8081
spring.mvc.locale=pt_BR
spring.mvc.locale-resolver=fixed
spring.jackson.time-zone=America/Fortaleza
spring.main.banner-mode=off

# 🔍 JPA & Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
spring.jpa.open-in-view=false

# 📝 Logging detalhado
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.pattern.console=%d{HH:mm:ss} %highlight(%-5level) [%thread] %cyan(%logger{36}) - %msg%n

# 🛡️ Segurança e serviços externos desativados para testes
spring.security.user.name=tester
spring.security.user.password=tester
spring.mail.host=localhost
spring.mail.port=2525
spring.cloud.config.enabled=false

# 🧹 Limpeza de testes
spring.sql.init.mode=never
spring.jpa.properties.hibernate.hbm2ddl.import_files_sql_extractor=org.hibernate.tool.schema.internal.exec.MultipleLinesSqlCommandExtractor
#spring.main.web-application-type=none
