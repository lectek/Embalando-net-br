###############################################################################
#  PERFIL: production
#  (ative com:  SPRING_PROFILES_ACTIVE=prod  ou  --spring.profiles.active=prod)
###############################################################################

## ----------------------------------------------------------------
## 1. Servidor
## ----------------------------------------------------------------
server.port=8080                       # porta interna do container
server.shutdown=graceful
server.error.include-message=never
# tempo para graceful shutdown (milissegundos)
spring.lifecycle.timeout-per-shutdown-phase=30s

## ----------------------------------------------------------------
## 2. Datasource (MySQL 8 / Aurora / RDS)
## ----------------------------------------------------------------
spring.datasource.url=jdbc:mysql://db.prod.internal:3306/embalando?useSSL=true&requireSSL=true&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:embalando}
spring.datasource.password=${DB_PASSWORD}      # defina via variável de ambiente
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=embalando-prod-pool

## ----------------------------------------------------------------
## 3. JPA / Hibernate
## ----------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate        # nunca use update em produção
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# migrações Flyway (se usar)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

## ----------------------------------------------------------------
## 4. Cache (Caffeine + 2nd-level cache Hibernate)
## ----------------------------------------------------------------
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=5000,expireAfterWrite=10m

spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.JCacheRegionFactory
spring.jpa.properties.javax.cache.provider=org.ehcache.jsr107.EhcacheCachingProvider

## ----------------------------------------------------------------
## 5. Segurança (Spring Security + JWT)
## ----------------------------------------------------------------
# chave secreta usada para assinar tokens JWT (defina via ambiente seguro)
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-in-ms=900000          # 15 min

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://auth.embalando.com/realms/embalando
spring.security.oauth2.client.registration.embalando.client-id=${OAUTH_CLIENT_ID}
spring.security.oauth2.client.registration.embalando.client-secret=${OAUTH_CLIENT_SECRET}

## ----------------------------------------------------------------
## 6. E-mail (SMTP transacional)
## ----------------------------------------------------------------
spring.mail.host=email-smtp.eu-west-1.amazonaws.com
spring.mail.port=587
spring.mail.username=${SMTP_USER}
spring.mail.password=${SMTP_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8
spring.mail.from=no-reply@embalando.com

## ----------------------------------------------------------------
## 7. Logging
## ----------------------------------------------------------------
# nível padrão
logging.level.root=INFO
# pacotes internos em DEBUG/SLOW query
logging.level.br.com.embalando=INFO
logging.level.org.hibernate.SQL=ERROR
logging.level.org.springframework.web=INFO
# arquivo rotativo (Logback padrão)
logging.file.name=/var/log/embalando/embalando.log
logging.file.max-size=10MB
logging.file.total-size-cap=100MB

## ----------------------------------------------------------------
## 8. Actuator / Métricas
## ----------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.metrics.export.prometheus.enabled=true
management.server.port=8081

## ----------------------------------------------------------------
## 9. CORS (exemplo liberando domínio público)
## ----------------------------------------------------------------
# app-specific: valores lidos pelo WebMvcConfig
app.cors.allowed-origins=https://app.embalando.com
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type

## ----------------------------------------------------------------
## 10. Misc
## ----------------------------------------------------------------
spring.main.banner-mode=off
spring.mvc.locale=pt_BR
spring.mvc.format.date=iso

spring.datasource.url=jdbc:mysql://mysql:3306/embalando?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=embalando
spring.datasource.password=embalando_pwd
spring.jpa.hibernate.ddl-auto=update
