# ================================
# PERFIL DEV
# ================================

spring.application.name=embalando-api
server.port=8080

# Tentativas de conexão (Spring Boot 3+)
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# Logs
logging.level.root=DEBUG

# MYSQL DENTRO DO DOCKER
spring.datasource.url=jdbc:mysql://mysql:3306/embalando?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ACTUATOR
management.endpoints.web.exposure.include=health,info
management.server.port=8081
management.endpoint.health.show-details=always
