# ============================================================================
# PERFIL: DESENVOLVIMENTO LOCAL
# Arquivo: src/main/resources/application-dev.properties
# Java 17 • Spring Boot 3 • MySQL 8 (container mysql_embalando)
# ============================================================================

# 1️⃣ APLICAÇÃO ---------------------------------------------------------------
spring.application.name=embalando-dev
server.port=8080
spring.mvc.locale=pt_BR
spring.mvc.locale-resolver=fixed
spring.jackson.time-zone=America/Fortaleza
spring.main.banner-mode=console
spring.output.ansi.enabled=always

# 2️⃣ DATABASE — MySQL em container `mysql_embalando` -------------------------
# Suba com:
#   docker run --name mysql_embalando \
#     -e MYSQL_DATABASE=embalando \
#     -e MYSQL_USER=embalando \
#     -e MYSQL_PASSWORD=embalando \
#     -e MYSQL_ROOT_PASSWORD=embalando \
#     -p 3306:3306 -d mysql:8
spring.datasource.url=jdbc:mysql://localhost:3306/embalando?characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:embalando}
spring.datasource.password=${DB_PASS:embalando}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# 3️⃣ JPA / HIBERNATE ---------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update                # cria/atualiza schema
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true                            # imprime queries
spring.jpa.properties.hibernate.format_sql=true     # quebra-linha bonita
spring.jpa.properties.hibernate.highlight_sql=true  # cores no console
spring.jpa.open-in-view=false                       # boa prática

# 4️⃣ THYMELEAF ----------------------------------------------------------------
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false                        # reload a cada save

# 5️⃣ LOGGING (DETALHADO, SEM SENHAS) -----------------------------------------
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.boot.actuate=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.pattern.console=%d{HH:mm:ss} %highlight(%-5level) [%thread] %cyan(%logger{36}) - %msg%n

# 6️⃣ SEGURANÇA LOCAL (opcional) ------------------------------------------------
#spring.security.user.name=admin
#spring.security.user.password=${DEV_ADMIN_PASS:admin}

# 7️⃣ DEV-TOOLS E OUTROS --------------------------------------------------------
spring.devtools.restart.enabled=true
spring.sql.init.mode=never              # evita rodar schema.sql/data.sql
management.endpoints.web.exposure.include=health,info

# 8️⃣ EMAIL FAKE (evita envio real) -------------------------------------------
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.transport.protocol=smtp
