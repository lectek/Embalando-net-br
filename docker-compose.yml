services:
  mysql:
    image: mysql:8.4
    container_name: mysql_embalando
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: embalando
      MYSQL_USER: embalando
      MYSQL_PASSWORD: embalando_pwd
      MYSQL_ROOT_PASSWORD: root_pwd
    ports:
      - "3307:3306"
    networks:
      - back
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: embalando_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - back

networks:
  back:
